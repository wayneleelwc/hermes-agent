<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes 记忆与知识系统 — 配图目录</title>
  <style>
    :root {
      --c-bg: #fefcf3;
      --c-canvas: #ffffff;
      --c-border: #e5dcc8;
      --c-text-main: #1a1a1a;
      --c-text-sub: #8a7e6b;
      --c-accent: #f5c518;
      --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--c-bg);
      font-family: var(--font-ui);
      color: var(--c-text-main);
      padding: 48px 32px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 {
      font-size: 28px; font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px; color: var(--c-text-sub);
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--c-canvas);
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      border-color: var(--c-accent);
      box-shadow: 0 2px 12px rgba(245,197,24,0.15);
    }
    .card-thumb {
      width: 100%; height: 160px;
      background: #faf7ee;
      display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--c-border);
      font-size: 13px; color: var(--c-text-sub);
    }
    .card-body { padding: 14px 16px; }
    .card-num {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      background: var(--c-accent);
      color: #1a1a1a;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 15px; font-weight: 600;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 12px; color: var(--c-text-sub);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hermes 记忆与知识系统 — 配图目录</h1>
    <p class="subtitle">第 03 篇 · 双层架构与自进化闭环 · 共 7 张配图 · Tab 交互模式</p>
    <div class="grid">

      <a class="card" href="./all-diagrams.html">
        <div class="card-thumb" style="font-size:32px;">🧠</div>
        <div class="card-body">
          <span class="card-num">全景图集</span>
          <div class="card-title">记忆与知识系统 — 全景图集</div>
          <div class="card-desc">7 张配图合并为一个 Tab 交互页面<br>封面 · 架构全景 · Provider生命周期 · 对比矩阵<br>知识转化 · Skill生命周期 · Curator审查</div>
        </div>
      </a>

    </div>
    <p style="margin-top:32px;text-align:center;font-size:13px;color:var(--c-text-sub);">
      💡 点击上方卡片进入交互式全景图集，通过顶部 Tab 切换查看 7 张配图
    </p>
  </div>
</body>
</html>
